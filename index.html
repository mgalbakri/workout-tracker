    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'https://onfgvhrkrzacyvllwdgn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmd2aHJrcnphY3l2bGx3ZGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMjcxMDQsImV4cCI6MjA4MzkwMzEwNH0.0fFIFNLNZnh2YaiJO3RNnQcp7OvNrcoTT0GNdn_UtP4';

    const supabase = {
      from: (table) => ({
        select: (columns = '*') => ({
          eq: (column, value) => ({
            order: (col, { ascending = true } = {}) => ({
              async then(resolve) {
                try {
                  const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?select=${columns}&${column}=eq.${value}&order=${col}.${ascending ? 'asc' : 'desc'}`,
                    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }}
                  );
                  const data = await res.json();
                  resolve({ data, error: res.ok ? null : data });
                } catch (error) { resolve({ data: null, error }); }
              }
            }),
            async then(resolve) {
              try {
                const res = await fetch(
                  `${SUPABASE_URL}/rest/v1/${table}?select=${columns}&${column}=eq.${value}`,
                  { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }}
                );
                const data = await res.json();
                resolve({ data, error: res.ok ? null : data });
              } catch (error) { resolve({ data: null, error }); }
            }
          })
        }),
        upsert: async (record) => {
          try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
              method: 'POST',
              headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
              body: JSON.stringify(record)
            });
            return { error: res.ok ? null : await res.json() };
          } catch (error) { return { error }; }
        },
        insert: async (record) => {
          try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
              method: 'POST',
              headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
              body: JSON.stringify(record)
            });
            return { error: res.ok ? null : await res.json() };
          } catch (error) { return { error }; }
        }
      })
    };

    const getUserId = () => {
      let userId = localStorage.getItem('workout_user_id');
      if (!userId) {
        userId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('workout_user_id', userId);
      }
      return userId;
    };

    // Utility Functions
    const getProgramWeek = (workouts) => {
      const dates = Object.keys(workouts).sort();
      if (dates.length === 0) return null;
      const firstWorkoutDate = new Date(dates[0]);
      const today = new Date();
      const diffDays = Math.floor((today - firstWorkoutDate) / (1000 * 60 * 60 * 24));
      return Math.floor(diffDays / 7) + 1;
    };

    const formatDate = (date) => new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    
    const formatDateLong = (date) => new Date(date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    const getMonday = (d) => {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    };

    // Parse sets from string like "3×6-8" or "2×12-15"
    const parseSets = (setsStr) => {
      const match = setsStr.match(/(\d+)/);
      return match ? parseInt(match[1]) : 3;
    };

    // Program Data
    const PROGRAM = {
      1: {
        name: "Strength",
        identity: "Force Production",
        accent: "rust",
        warmup: ["Cat-Camel × 10", "90/90 Hip Switches × 12/side", "Ankle Wall Mobilization × 12/side", "Glute Bridge × 12", "Hip CARs × 5/side", "Scapular Pull-Ups × 6-8", "3 nasal breaths"],
        exercises: [
          { name: "Belt Squat / Landmine Hack Squat", sets: "3×6-8", rest: "3 min", note: "RPE 7-8" },
          { name: "Chest-Supported Row Machine", sets: "3×8-10", rest: "2 min", note: "Full ROM" },
          { name: "Machine Chest Press", sets: "3×8-10", rest: "2 min", note: "Control eccentric" },
          { name: "Face Pulls", sets: "3×15", rest: "90s", note: "Light, feel it" },
          { name: "Farmer Carry", sets: "3×40m", rest: "90s", note: "Heavy as form allows" }
        ],
        finisher: "Zone 2 Row · 15-20 min @ 128-135 bpm"
      },
      2: {
        name: "Cardio",

        accent: "slate",
        warmup: ["Leg swings × 10/side", "Walking lunges × 10", "Arm circles × 20", "Light rowing × 3 min"],
        exercises: [{ name: "5K Row", sets: "1", rest: "—", note: "Target: 35:00, HR 128-135" }],
        finisher: "Stretch · Hip flexors, hamstrings, shoulders"
      },
      3: {
        name: "Posterior",
        identity: "Pull Strength",
        accent: "sage",
        warmup: ["Cat-Camel × 10", "Bird-Dog × 8/side", "Hip CARs × 5/side", "Band Pull-Aparts × 15", "Dead Hang × 30s", "3 nasal breaths"],
        exercises: [
          { name: "Trap Bar Deadlift", sets: "3×5", rest: "3-4 min", note: "RPE 7-8, brace hard" },
          { name: "Lat Pulldown", sets: "3×8-10", rest: "2 min", note: "Pause at bottom" },
          { name: "Incline DB Curl", sets: "2×12-15", rest: "90s", note: "Stretch at bottom" },
          { name: "Cable Woodchop", sets: "2×12/side", rest: "60s", note: "Anti-rotation focus" },
          { name: "Dead Hang", sets: "3× max", rest: "60s", note: "Decompress spine" }
        ],
        finisher: "Zone 2 Row · 15-20 min @ 128-135 bpm"
      },
      4: {
        name: "Recovery",
        identity: "Mobility & Flow",
        accent: "clay",
        warmup: ["Box breathing × 5 cycles"],
        exercises: [
          { name: "Foam Roll Full Body", sets: "1", rest: "—", note: "10 min, slow, breathe" },
          { name: "90/90 Stretch", sets: "1", rest: "—", note: "2 min/side" },
          { name: "Couch Stretch", sets: "1", rest: "—", note: "2 min/side" },
          { name: "Thread the Needle", sets: "1", rest: "—", note: "10/side" },
          { name: "Supine Spinal Twist", sets: "1", rest: "—", note: "2 min/side" },
          { name: "Legs Up Wall", sets: "1", rest: "—", note: "5-10 min, nasal breathing" }
        ],
        finisher: "Optional · Light walk or Zone 2 for 20-30 min"
      }
    };

    const BENCHMARKS = [
      { id: "5k_row", name: "5K Row", unit: "mm:ss", target: "35:00", description: "All-out effort" },
      { id: "2k_row", name: "2K Row", unit: "mm:ss", description: "Max effort" },
      { id: "10min_row", name: "10-Min Row", unit: "meters", description: "Max distance" },
      { id: "dead_hang", name: "Dead Hang", unit: "seconds", description: "Max time" },
      { id: "farmer_carry", name: "Farmer Carry", unit: "meters", description: "60s, max distance" },
      { id: "trap_bar_dl", name: "Trap Bar DL", unit: "kg", description: "5RM @ RPE 8" },
      { id: "pull_ups", name: "Pull-Ups", unit: "reps", description: "Max reps" },
      { id: "plank", name: "Plank", unit: "seconds", description: "Max hold" },
    ];

    const SORENESS_AREAS = ["Neck/Traps", "Shoulders", "Chest", "Upper Back", "Lower Back", "Glutes/Hips", "Quads", "Hamstrings"];

    // Exercise Card Component with per-set logging
    const ExerciseCard = ({ exercise, data, onChange }) => {
      const numSets = parseSets(exercise.sets);
      const sets = data?.sets || [];
      const isSkipped = data?.skipped || false;

      const updateSet = (setIndex, field, value) => {
        const newSets = [...sets];
        if (!newSets[setIndex]) newSets[setIndex] = {};
        newSets[setIndex][field] = value;
        onChange({ ...data, sets: newSets, skipped: false });
      };

      const toggleSetComplete = (setIndex) => {
        const newSets = [...sets];
        if (!newSets[setIndex]) newSets[setIndex] = {};
        newSets[setIndex].completed = !newSets[setIndex].completed;
        onChange({ ...data, sets: newSets, skipped: false });
      };

      const toggleSkip = () => {
        onChange({ ...data, skipped: !isSkipped, sets: [] });
      };

      const completedSets = sets.filter(s => s?.completed).length;

      return (
        <div className={`pb-6 border-b border-clay/20 last:border-0 last:pb-0 ${isSkipped ? 'opacity-50' : ''}`}>
          {/* Exercise Header */}
          <div className="flex items-start justify-between mb-3">
            <div className="flex-1">
              <h4 className={`font-medium ${isSkipped ? 'text-slate line-through' : 'text-ink'}`}>{exercise.name}</h4>
              <p className="text-slate text-sm">{exercise.sets} · Rest {exercise.rest}</p>
              {exercise.note && <p className="text-sage text-sm mt-1">{exercise.note}</p>}
            </div>
            <button 
              onClick={toggleSkip}
              className={`px-3 py-1 text-xs font-medium border transition-all ${isSkipped ? 'bg-slate text-white border-slate' : 'text-slate border-clay/50 hover:border-slate'}`}
            >
              {isSkipped ? 'Skipped' : 'Skip'}
            </button>
          </div>

          {/* Progress indicator */}
          {!isSkipped && numSets > 1 && (
            <div className="flex items-center gap-2 mb-3">
              <div className="flex gap-1">
                {Array.from({ length: numSets }).map((_, i) => (
                  <div 
                    key={i} 
                    className={`w-2 h-2 rounded-full transition-colors ${sets[i]?.completed ? 'bg-ink' : 'bg-clay'}`}
                  />
                ))}
              </div>
              <span className="text-xs text-slate">{completedSets}/{numSets} sets</span>
            </div>
          )}

          {/* Sets */}
          {!isSkipped && (
            <div className="space-y-2">
              {Array.from({ length: numSets }).map((_, setIndex) => (
                <div key={setIndex} className="flex items-center gap-2">
                  <span className="text-xs text-slate w-8">Set {setIndex + 1}</span>
                  <input 
                    type="number" 
                    placeholder="kg" 
                    value={sets[setIndex]?.weight || ''}
                    onChange={(e) => updateSet(setIndex, 'weight', e.target.value)}
                    className="flex-1 px-3 py-2 bg-paper border border-clay/50 text-ink text-sm placeholder:text-slate/50 focus:outline-none focus:border-ink/30" 
                  />
                  <input 
                    type="number" 
                    placeholder="reps" 
                    value={sets[setIndex]?.reps || ''}
                    onChange={(e) => updateSet(setIndex, 'reps', e.target.value)}
                    className="w-16 px-3 py-2 bg-paper border border-clay/50 text-ink text-sm placeholder:text-slate/50 focus:outline-none focus:border-ink/30" 
                  />
                  <button
                    onClick={() => toggleSetComplete(setIndex)}
                    className={`w-8 h-8 border-2 flex items-center justify-center transition-all ${sets[setIndex]?.completed ? 'bg-ink border-ink' : 'border-clay hover:border-ink/30'}`}
                  >
                    {sets[setIndex]?.completed && (
                      <svg className="w-4 h-4 text-paper" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // Benchmark Card Component
    const BenchmarkCard = ({ bench, history, onSave }) => {
      const [inputValue, setInputValue] = useState('');
      const latest = history[history.length - 1];
      
      return (
        <div className="bg-white border border-clay/50 p-6 fade-in">
          <div className="flex justify-between items-start mb-5">
            <div>
              <h4 className="text-lg font-medium text-ink">{bench.name}</h4>
              <p className="text-slate text-sm mt-0.5">{bench.description}</p>
              {bench.target && <p className="text-sage text-sm mt-1">Target: {bench.target}</p>}
            </div>
            {latest && (
              <div className="text-right">
                <p className="text-2xl font-serif text-ink">{latest.value}</p>
                <p className="text-slate text-xs mt-1">{formatDate(latest.recorded_at)}</p>
              </div>
            )}
          </div>
          <div className="flex gap-3">
            <input type="text" placeholder={bench.unit} value={inputValue} onChange={(e) => setInputValue(e.target.value)}
              className="flex-1 px-4 py-3 bg-paper border border-clay/50 text-ink placeholder:text-slate/50 focus:outline-none focus:border-ink/30 transition-colors" />
            <button onClick={() => { if (inputValue) { onSave(bench.id, inputValue); setInputValue(''); }}}
              className="px-6 py-3 bg-ink text-paper font-medium hover:bg-ink/90 active:scale-[0.98] transition-all">
              Log
            </button>
          </div>
          {history.length > 1 && (
            <div className="mt-5 pt-5 border-t border-clay/30">
              <div className="flex gap-6 overflow-x-auto">
                {history.slice(-5).map((entry, i) => (
                  <div key={i} className="text-center min-w-fit">
                    <p className="font-medium text-ink">{entry.value}</p>
                    <p className="text-slate text-xs mt-0.5">{formatDate(entry.recorded_at)}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Main App
    function App() {
      const [activeTab, setActiveTab] = useState('log');
      const [selectedDay, setSelectedDay] = useState(1);
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [workouts, setWorkouts] = useState({});
      const [biometrics, setBiometrics] = useState({});
      const [benchmarks, setBenchmarks] = useState({});
      const [todayBiometrics, setTodayBiometrics] = useState({ weight: '', hrv: '', restingHR: '', sleep: '', soreness: {} });
      const [exerciseData, setExerciseData] = useState({});
      const [toast, setToast] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('synced');

      const userId = getUserId();
      
      // Random quote for the session
      const todayQuote = useMemo(() => {
        const seed = new Date().toDateString() + selectedDay;
        let hash = 0;
        for (let i = 0; i < seed.length; i++) { hash = ((hash << 5) - hash) + seed.charCodeAt(i); hash |= 0; }
        return QUOTES[Math.abs(hash) % QUOTES.length];
      }, [selectedDay, selectedDate]);

      // Load Data
      useEffect(() => {
        const loadData = async () => {
          setIsLoading(true);
          try {
            const { data: workoutData } = await supabase.from('workouts').select('*').eq('user_id', userId);
            const workoutMap = {};
            workoutData?.forEach(w => { workoutMap[w.date] = { day: w.day_number, exercises: w.exercises || {}, completedAt: w.completed_at }; });
            setWorkouts(workoutMap);

            const { data: bioData } = await supabase.from('biometrics').select('*').eq('user_id', userId);
            const bioMap = {};
            bioData?.forEach(b => { bioMap[b.date] = { weight: b.weight, hrv: b.hrv, restingHR: b.resting_hr, sleep: b.sleep, soreness: b.soreness || {} }; });
            setBiometrics(bioMap);

            const { data: benchData } = await supabase.from('benchmarks').select('*').eq('user_id', userId).order('recorded_at', { ascending: true });
            const benchMap = {};
            benchData?.forEach(b => { if (!benchMap[b.benchmark_id]) benchMap[b.benchmark_id] = []; benchMap[b.benchmark_id].push({ value: b.value, recorded_at: b.recorded_at }); });
            setBenchmarks(benchMap);
            setSyncStatus('synced');
          } catch (error) { console.error('Load error:', error); setSyncStatus('error'); }
          setIsLoading(false);
        };
        loadData();
      }, [userId]);

      useEffect(() => {
        const currentWorkout = workouts[selectedDate];
        if (currentWorkout) { setExerciseData(currentWorkout.exercises || {}); setSelectedDay(currentWorkout.day); }
        else { setExerciseData({}); }
      }, [selectedDate, workouts]);

      useEffect(() => {
        const todayData = biometrics[selectedDate];
        if (todayData) { setTodayBiometrics({ weight: todayData.weight || '', hrv: todayData.hrv || '', restingHR: todayData.restingHR || '', sleep: todayData.sleep || '', soreness: todayData.soreness || {} }); }
        else { setTodayBiometrics({ weight: '', hrv: '', restingHR: '', sleep: '', soreness: {} }); }
      }, [selectedDate, biometrics]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

      const handleSaveWorkout = async () => {
        setSyncStatus('syncing');
        try {
          await supabase.from('workouts').upsert({ user_id: userId, date: selectedDate, day_number: selectedDay, exercises: exerciseData, completed_at: new Date().toISOString() });
          setWorkouts(prev => ({ ...prev, [selectedDate]: { day: selectedDay, exercises: exerciseData, completedAt: new Date().toISOString() }}));
          setSyncStatus('synced'); showToast('Workout saved');
        } catch (error) { setSyncStatus('error'); showToast('Error saving'); }
      };

      const handleSaveBiometrics = async () => {
        setSyncStatus('syncing');
        try {
          await supabase.from('biometrics').upsert({ user_id: userId, date: selectedDate, weight: todayBiometrics.weight || null, hrv: todayBiometrics.hrv || null, resting_hr: todayBiometrics.restingHR || null, sleep: todayBiometrics.sleep || null, soreness: todayBiometrics.soreness });
          setBiometrics(prev => ({ ...prev, [selectedDate]: { ...todayBiometrics }}));
          setSyncStatus('synced'); showToast('Biometrics saved');
        } catch (error) { setSyncStatus('error'); showToast('Error saving'); }
      };

      const handleSaveBenchmark = async (benchmarkId, value) => {
        setSyncStatus('syncing');
        try {
          await supabase.from('benchmarks').insert({ user_id: userId, benchmark_id: benchmarkId, value: value, recorded_at: new Date().toISOString() });
          setBenchmarks(prev => ({ ...prev, [benchmarkId]: [...(prev[benchmarkId] || []), { value, recorded_at: new Date().toISOString() }]}));
          setSyncStatus('synced'); showToast('Benchmark recorded');
        } catch (error) { setSyncStatus('error'); showToast('Error saving'); }
      };

      const updateExercise = (exerciseName, data) => {
        setExerciseData(prev => ({ ...prev, [exerciseName]: data }));
      };

      const getReadinessScore = () => {
        const today = biometrics[selectedDate];
        if (!today) return null;
        let score = 70;
        if (today.hrv) { const hrvValues = Object.values(biometrics).filter(b => b.hrv).map(b => parseFloat(b.hrv)); const avgHRV = hrvValues.length > 0 ? hrvValues.reduce((a, b) => a + b, 0) / hrvValues.length : parseFloat(today.hrv); score += (parseFloat(today.hrv) - avgHRV) * 0.5; }
        if (today.sleep) score += (parseFloat(today.sleep) - 7) * 5;
        const sorenessCount = Object.values(today.soreness || {}).filter(v => v >= 3).length;
        score -= sorenessCount * 3;
        return Math.max(0, Math.min(100, Math.round(score)));
      };

      const isDeloadWeek = () => { const weekNum = getProgramWeek(workouts); return weekNum ? weekNum % 5 === 0 : false; };

      const getWeeklyCompletion = () => {
        const weeks = [];
        for (let i = 3; i >= 0; i--) {
          const weekStart = getMonday(new Date(Date.now() - i * 7 * 24 * 60 * 60 * 1000));
          const days = []; let completedCount = 0;
          for (let d = 0; d < 7; d++) {
            const date = new Date(weekStart); date.setDate(date.getDate() + d);
            const dateStr = date.toISOString().split('T')[0];
            const workout = workouts[dateStr];
            if (workout) completedCount++;
            days.push({ date: dateStr, completed: !!workout, day: workout?.day });
          }
          weeks.push({ weekStart: formatDate(weekStart), days, completedCount });
        }
        return weeks;
      };

      const program = PROGRAM[selectedDay];
      const readiness = getReadinessScore();
      const programWeek = getProgramWeek(workouts);

      // Calculate workout progress
      const getWorkoutProgress = () => {
        let totalSets = 0;
        let completedSets = 0;
        program.exercises.forEach(ex => {
          const numSets = parseSets(ex.sets);
          const data = exerciseData[ex.name];
          if (data?.skipped) return;
          totalSets += numSets;
          completedSets += (data?.sets || []).filter(s => s?.completed).length;
        });
        return { totalSets, completedSets, percent: totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0 };
      };

      const progress = getWorkoutProgress();

      if (isLoading) {
        return (
          <div className="min-h-screen bg-paper flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-2 border-clay border-t-ink rounded-full animate-spin mx-auto mb-4" />
              <p className="text-slate">Loading...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-paper">
          {/* Toast */}
          {toast && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-ink text-paper px-6 py-3 text-sm font-medium fade-in">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className="bg-paper border-b border-clay/50 sticky top-0 z-40">
            <div className="max-w-xl mx-auto px-6 py-5">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-serif text-ink tracking-tight">Longevity</h1>
                  <p className="text-slate text-sm mt-0.5">
                    {programWeek ? (
                      <>Week {programWeek}{isDeloadWeek() && <span className="text-rust ml-2">· Deload</span>}</>
                    ) : 'Begin your journey'}
                  </p>
                </div>
                <div className="flex items-center gap-3">
                  <span className={`w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-sage' : syncStatus === 'syncing' ? 'bg-rust animate-pulse' : 'bg-red-500'}`} />
                  {readiness && (
                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-lg font-serif text-white ${readiness >= 80 ? 'bg-sage' : readiness >= 60 ? 'bg-rust' : 'bg-slate'}`}>
                      {readiness}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </header>

          {/* Navigation */}
          <nav className="bg-paper border-b border-clay/50 sticky top-[85px] z-30">
            <div className="max-w-xl mx-auto px-6">
              <div className="flex">
                {[{ id: 'log', label: 'Log' }, { id: 'dashboard', label: 'Progress' }, { id: 'biometrics', label: 'Biometrics' }, { id: 'benchmarks', label: 'Benchmarks' }].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                    className={`flex-1 py-4 text-sm font-medium transition-colors border-b-2 ${activeTab === tab.id ? 'text-ink border-ink' : 'text-slate border-transparent hover:text-ink'}`}>
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <main className="max-w-xl mx-auto px-6 py-8 pb-24">
            
            {/* LOG TAB */}
            {activeTab === 'log' && (
              <div className="space-y-8 fade-in">
                {/* Motivational Quote */}
                <div className="text-center py-6 quote-fade">
                  <p className="font-serif text-xl text-ink italic leading-relaxed">"{todayQuote.text}"</p>
                  <p className="text-slate text-sm mt-3">— {todayQuote.author}</p>
                </div>

                {/* Date */}
                <div className="text-center">
                  <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)}
                    className="text-center text-lg font-medium text-ink bg-transparent focus:outline-none cursor-pointer" />
                  <p className="text-slate text-sm mt-1">{formatDateLong(selectedDate)}</p>
                </div>

                {/* Day Selector */}
                <div className="grid grid-cols-4 gap-2">
                  {[1, 2, 3, 4].map(day => (
                    <button key={day} onClick={() => setSelectedDay(day)}
                      className={`py-4 border transition-all ${selectedDay === day ? 'bg-ink text-paper border-ink' : 'bg-white text-ink border-clay/50 hover:border-ink/30'}`}>
                      <span className="text-xl font-serif block">{day}</span>
                      <span className="text-xs opacity-70">{PROGRAM[day].name}</span>
                    </button>
                  ))}
                </div>

                {/* Workout Card */}
                <div className="bg-white border border-clay/50">
                  {/* Header */}
                  <div className="p-6 border-b border-clay/30">
                    <div className="flex justify-between items-start">
                      <div>
                        <p className="text-xs uppercase tracking-widest text-slate mb-1">{program.identity}</p>
                        <h2 className="text-2xl font-serif text-ink">{program.name}</h2>
                      </div>
                      {progress.totalSets > 0 && (
                        <div className="text-right">
                          <p className="text-2xl font-serif text-ink">{progress.percent}%</p>
                          <p className="text-xs text-slate">{progress.completedSets}/{progress.totalSets} sets</p>
                        </div>
                      )}
                    </div>
                    {/* Progress bar */}
                    {progress.totalSets > 0 && (
                      <div className="mt-4 h-1 bg-clay/30 overflow-hidden">
                        <div className="h-full bg-ink transition-all duration-300" style={{ width: `${progress.percent}%` }} />
                      </div>
                    )}
                  </div>

                  {/* Warmup */}
                  <div className="p-6 border-b border-clay/30 bg-paper/50">
                    <p className="text-xs uppercase tracking-widest text-slate mb-3">Warm-Up</p>
                    <div className="space-y-1.5">
                      {program.warmup.map((item, i) => <p key={i} className="text-ink/80 text-sm">{item}</p>)}
                    </div>
                  </div>

                  {/* Exercises */}
                  <div className="p-6">
                    <p className="text-xs uppercase tracking-widest text-slate mb-4">Exercises</p>
                    <div className="space-y-6">
                      {program.exercises.map((ex, i) => (
                        <ExerciseCard 
                          key={i} 
                          exercise={ex} 
                          data={exerciseData[ex.name]} 
                          onChange={(data) => updateExercise(ex.name, data)} 
                        />
                      ))}
                    </div>
                  </div>

                  {/* Finisher */}
                  {program.finisher && (
                    <div className="p-6 bg-paper/50 border-t border-clay/30">
                      <p className="text-xs uppercase tracking-widest text-slate mb-1">Finisher</p>
                      <p className="text-ink">{program.finisher}</p>
                    </div>
                  )}
                </div>

                {/* Save Button */}
                <button onClick={handleSaveWorkout} disabled={syncStatus === 'syncing'}
                  className="w-full py-4 bg-ink text-paper font-medium hover:bg-ink/90 active:scale-[0.99] transition-all disabled:opacity-50">
                  {syncStatus === 'syncing' ? 'Saving...' : 'Save Workout'}
                </button>
              </div>
            )}

            {/* DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8 fade-in">
                <div className="bg-white border border-clay/50 p-6">
                  <p className="text-xs uppercase tracking-widest text-slate mb-4">Weekly Progress</p>
                  <div className="space-y-3">
                    {getWeeklyCompletion().map((week, wi) => (
                      <div key={wi} className="flex items-center gap-4">
                        <span className="text-slate text-sm w-14">{week.weekStart}</span>
                        <div className="flex gap-1 flex-1">
                          {week.days.map((day, di) => (
                            <div key={di} className={`w-8 h-8 flex items-center justify-center text-xs font-medium ${day.completed ? 'bg-ink text-paper' : 'bg-clay/30 text-slate'}`}>
                              {day.completed ? day.day : '·'}
                            </div>
                          ))}
                        </div>
                        <span className={`font-serif text-lg w-6 text-right ${week.completedCount >= 4 ? 'text-ink' : 'text-slate'}`}>{week.completedCount}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white border border-clay/50 p-6">
                  <p className="text-xs uppercase tracking-widest text-slate mb-4">Recent Workouts</p>
                  <div className="space-y-3">
                    {Object.entries(workouts).sort((a, b) => new Date(b[0]) - new Date(a[0])).slice(0, 8).map(([date, workout]) => (
                      <div key={date} className="flex items-center justify-between py-2 border-b border-clay/20 last:border-0">
                        <div className="flex items-center gap-3">
                          <span className="w-8 h-8 bg-ink text-paper flex items-center justify-center font-serif">{workout.day}</span>
                          <span className="text-ink">{PROGRAM[workout.day]?.name}</span>
                        </div>
                        <span className="text-slate text-sm">{formatDate(date)}</span>
                      </div>
                    ))}
                    {Object.keys(workouts).length === 0 && <p className="text-slate text-center py-8">No workouts logged yet</p>}
                  </div>
                </div>
              </div>
            )}

            {/* BIOMETRICS TAB */}
            {activeTab === 'biometrics' && (
              <div className="space-y-8 fade-in">
                <div className="bg-white border border-clay/50 p-6 space-y-6">
                  <p className="text-xs uppercase tracking-widest text-slate">Daily Check-In</p>
                  
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate text-sm block mb-2">Weight (kg)</label>
                      <input type="number" step="0.1" value={todayBiometrics.weight} onChange={(e) => setTodayBiometrics(prev => ({ ...prev, weight: e.target.value }))}
                        className="w-full px-4 py-3 bg-paper border border-clay/50 text-ink placeholder:text-slate/50 focus:outline-none focus:border-ink/30" placeholder="75.5" />
                    </div>
                    <div>
                      <label className="text-slate text-sm block mb-2">HRV (ms)</label>
                      <input type="number" value={todayBiometrics.hrv} onChange={(e) => setTodayBiometrics(prev => ({ ...prev, hrv: e.target.value }))}
                        className="w-full px-4 py-3 bg-paper border border-clay/50 text-ink placeholder:text-slate/50 focus:outline-none focus:border-ink/30" placeholder="45" />
                    </div>
                    <div>
                      <label className="text-slate text-sm block mb-2">Resting HR</label>
                      <input type="number" value={todayBiometrics.restingHR} onChange={(e) => setTodayBiometrics(prev => ({ ...prev, restingHR: e.target.value }))}
                        className="w-full px-4 py-3 bg-paper border border-clay/50 text-ink placeholder:text-slate/50 focus:outline-none focus:border-ink/30" placeholder="58" />
                    </div>
                    <div>
                      <label className="text-slate text-sm block mb-2">Sleep (hrs)</label>
                      <input type="number" step="0.5" value={todayBiometrics.sleep} onChange={(e) => setTodayBiometrics(prev => ({ ...prev, sleep: e.target.value }))}
                        className="w-full px-4 py-3 bg-paper border border-clay/50 text-ink placeholder:text-slate/50 focus:outline-none focus:border-ink/30" placeholder="7.5" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate text-sm block mb-3">Soreness (1-5)</label>
                    <div className="grid grid-cols-2 gap-2">
                      {SORENESS_AREAS.map(area => (
                        <div key={area} className="flex items-center justify-between bg-paper px-3 py-2.5 border border-clay/30">
                          <span className="text-ink text-sm">{area}</span>
                          <select value={todayBiometrics.soreness[area] || ''} onChange={(e) => setTodayBiometrics(prev => ({ ...prev, soreness: { ...prev.soreness, [area]: e.target.value }}))}
                            className="w-14 text-center py-1 bg-white border border-clay/50 text-ink text-sm focus:outline-none">
                            <option value="">—</option>
                            {[1, 2, 3, 4, 5].map(n => <option key={n} value={n}>{n}</option>)}
                          </select>
                        </div>
                      ))}
                    </div>
                  </div>

                  <button onClick={handleSaveBiometrics} disabled={syncStatus === 'syncing'}
                    className="w-full py-4 bg-ink text-paper font-medium hover:bg-ink/90 active:scale-[0.99] transition-all disabled:opacity-50">
                    {syncStatus === 'syncing' ? 'Saving...' : 'Save Biometrics'}
                  </button>
                </div>

                <div className="bg-white border border-clay/50 p-6">
                  <p className="text-xs uppercase tracking-widest text-slate mb-4">Recent Data</p>
                  <div className="space-y-3">
                    {Object.entries(biometrics).sort((a, b) => new Date(b[0]) - new Date(a[0])).slice(0, 7).map(([date, data]) => (
                      <div key={date} className="flex items-center justify-between py-2 border-b border-clay/20 last:border-0">
                        <span className="text-slate text-sm">{formatDate(date)}</span>
                        <div className="flex gap-4 text-sm">
                          {data.weight && <span className="text-ink">{data.weight}kg</span>}
                          {data.hrv && <span className="text-sage">HRV {data.hrv}</span>}
                          {data.sleep && <span className="text-slate">{data.sleep}h</span>}
                        </div>
                      </div>
                    ))}
                    {Object.keys(biometrics).length === 0 && <p className="text-slate text-center py-4">No data yet</p>}
                  </div>
                </div>
              </div>
            )}

            {/* BENCHMARKS TAB */}
            {activeTab === 'benchmarks' && (
              <div className="space-y-6 fade-in">
                <div className="bg-paper border border-rust/30 p-4">
                  <p className="text-rust text-sm">Test benchmarks on the <span className="font-medium">last week of each month</span>, before deload.</p>
                </div>
                {BENCHMARKS.map(bench => <BenchmarkCard key={bench.id} bench={bench} history={benchmarks[bench.id] || []} onSave={handleSaveBenchmark} />)}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="fixed bottom-0 left-0 right-0 bg-paper border-t border-clay/50 py-4 px-6">
            <div className="max-w-xl mx-auto flex items-center justify-center gap-6 text-slate text-xs">
              <span>Zone 2: 128-135 bpm</span>
              <span className="w-1 h-1 rounded-full bg-clay" />
              <span>Deload: Week 5</span>
              <span className="w-1 h-1 rounded-full bg-clay" />
              <span>Age 43</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
